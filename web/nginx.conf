# ==============================================================
# 파일   web\nginx.conf — 배포용 웹 서버 설정 (80번 포트 하나로 전부)
# 역할   http://EC2주소/          → React 화면 (dist)
#        http://EC2주소/api/...   → Spring 컨테이너 api:8081 로 전달
#        브라우저는 주소 하나만 보므로 CORS 문제가 없습니다
# ==============================================================
# 요청 주소를 보고 화면 파일을 줄지, Spring 으로 넘길지 정합니다.
# 흐름: 요청 → /api/ 로 시작? → 예: api:8081 로 전달 / 아니오: dist 의 파일(없으면 index.html)
server {
    listen 80;                         # 80번 포트에서 요청을 받습니다
    server_name _;                     # 어떤 주소(IP)로 와도 받습니다

    # api 컨테이너의 IP 를 10초마다 다시 찾습니다 (127.0.0.11 = Docker 안의 이름 찾기 서버)
    # api 를 다시 만들면 IP 가 바뀔 수 있습니다 → 이 두 줄이 없으면 화면만 뜨고 /api 는 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8081; # 주소를 변수에 넣어야 resolver 로 다시 찾습니다

    root /usr/share/nginx/html;        # React build 결과(dist)가 들어 있는 폴더
    index index.html;

    # 화면 — 파일이 없으면 index.html (React 가 알아서 그립니다)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — Spring 으로 전달
    location /api/ {
        proxy_pass $api_upstream;      # compose 서비스 이름 api 로 Spring 컨테이너를 찾습니다 (주소 /api/... 는 그대로 전달)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # 진짜 사용자 IP 를 Spring 에 알려 줍니다
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;           # BERT 첫 로딩 · 챗봇 도구 여러 번 → 60초를 넘을 수 있습니다
        client_max_body_size 5m;           # 손글씨 그림(base64) 여유
    }

    # Swagger — http://EC2주소/swagger-ui.html 로 배포 서버 API 확인
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }
}