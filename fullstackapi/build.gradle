// 파일   fullstackapi\build.gradle — Spring 프로젝트의 라이브러리 목록 (Python 의 requirements.txt 자리)
// start.spring.io 가 만든 build.gradle 을 통째로 바꾼다 (★ = 로그인 · DB 에 필요한 라이브러리)
// 바꾼 뒤   IntelliJ 오른쪽 위 코끼리(Load Gradle Changes) → 라이브러리 내려받기
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.shinhan'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'          // 웹 서버(Tomcat) · @RestController · RestClient
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // ★ JPA (엔티티 ↔ 테이블)
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // ★ @Valid · @NotBlank
    implementation 'org.springframework.boot:spring-boot-starter-security'     // ★ Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'   // ★ Redis (Refresh Token · 블랙리스트)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'                           // ★ JWT 만들기 · 검사
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'  // ★ Swagger 화면 (/swagger-ui.html)
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'                             // ★ Oracle 드라이버
    compileOnly 'org.projectlombok:lombok'                                     // ★ Lombok (@Getter 등)
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}